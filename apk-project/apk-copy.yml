name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Install
        run: npm install
      - name: Prepare web files
        run: mkdir -p www && cp index.html www/index.html
      - name: Add Android project
        run: npx cap add android
      - name: Landscape + microphone permission
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's/<activity /<activity android:screenOrientation="sensorLandscape" /' $M
          sed -i 's#<application#<uses-permission android:name="android.permission.RECORD_AUDIO" /><uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" /><application#' $M
          grep -n "screenOrientation\|RECORD_AUDIO" $M
      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: space-survivor-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
